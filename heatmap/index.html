<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客点击热力图分析</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-number {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }
        .url-list {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
        }
        .url-item {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .url-item:hover {
            background: #f8f9fa;
        }
        .url-text {
            flex: 1;
            font-family: monospace;
            font-size: 12px;
            color: #333;
            word-break: break-all;
        }
        .url-count {
            background: #007bff;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            margin-left: 10px;
        }
        .controls {
            margin-bottom: 20px;
            text-align: center;
        }
        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            margin: 0 10px;
            font-size: 14px;
        }
        .btn:hover {
            background: #0056b3;
        }
        .btn.danger {
            background: #dc3545;
        }
        .btn.danger:hover {
            background: #c82333;
        }
        .heatmap-preview {
            margin-top: 20px;
            border: 2px dashed #ddd;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            color: #666;
        }
        kbd {
            background: #f1f3f4;
            border: 1px solid #dadce0;
            border-radius: 4px;
            color: #5f6368;
            font-family: monospace;
            font-size: 11px;
            padding: 2px 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 博客点击热力图分析</h1>
        <p style="color: #666; margin-bottom: 30px;">
            分析用户在博客上的点击行为，了解最受欢迎的内容区域
        </p>

        <div class="controls">
            <button class="btn" onclick="exportData()">📊 导出数据</button>
            <button class="btn danger" onclick="clearAllData()">🗑️ 清除所有数据</button>
        </div>

        <div class="stats" id="stats">
            <!-- 统计数据将通过JavaScript填充 -->
        </div>

        <h2>📍 页面点击分布</h2>
        <div class="url-list" id="urlList">
            <!-- URL列表将通过JavaScript填充 -->
        </div>

        <div class="heatmap-preview">
            <p>💡 提示：在任何博客页面按住 <kbd>Alt</kbd> 键查看该页面的热力图</p>
        </div>
    </div>

    <script src="click-tracker.js"></script>
    <script>
        function loadStats() {
            const clicks = window.heatmapTracker.clicks;
            const urlStats = {};

            // 统计每个URL的点击次数
            clicks.forEach(click => {
                urlStats[click.url] = (urlStats[click.url] || 0) + 1;
            });

            // 排序
            const sortedUrls = Object.entries(urlStats)
                .sort(([,a], [,b]) => b - a);

            // 更新统计卡片
            const totalClicks = clicks.length;
            const totalPages = Object.keys(urlStats).length;
            const avgClicksPer = totalPages > 0 ? Math.round(totalClicks / totalPages) : 0;

            document.getElementById('stats').innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${totalClicks}</div>
                    <div class="stat-label">总点击次数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${totalPages}</div>
                    <div class="stat-label">分析页面数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${avgClicksPer}</div>
                    <div class="stat-label">平均每页点击</div>
                </div>
            `;

            // 更新URL列表
            const urlListHtml = sortedUrls.map(([url, count]) => `
                <div class="url-item">
                    <div class="url-text">${url}</div>
                    <div class="url-count">${count} 次点击</div>
                </div>
            `).join('');

            document.getElementById('urlList').innerHTML = urlListHtml ||
                '<div style="text-align: center; padding: 40px; color: #999;">暂无点击数据</div>';
        }

        function exportData() {
            const data = window.heatmapTracker.exportData();
            const blob = new Blob([JSON.stringify(data, null, 2)], {
                type: 'application/json'
            });

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `heatmap-data-${new Date().toISOString().split('T')[0]}.json`;
            a.click();

            URL.revokeObjectURL(url);
        }

        function clearAllData() {
            if (confirm('确定要清除所有热力图数据吗？此操作不可恢复。')) {
                window.heatmapTracker.clearData();
                loadStats();
            }
        }

        // 页面加载时更新统计
        loadStats();

        // 定期更新（每5秒）
        setInterval(loadStats, 5000);
    </script>
</body>
</html>
