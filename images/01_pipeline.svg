<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650">
  <defs>
    <linearGradient id="dataGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a7a94"/>
      <stop offset="100%" stop-color="#4a6a84"/>
    </linearGradient>
    <linearGradient id="cleanGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6a9a8a"/>
      <stop offset="100%" stop-color="#5a8a7a"/>
    </linearGradient>
    <linearGradient id="featureGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a8a6a"/>
      <stop offset="100%" stop-color="#7a7a5a"/>
    </linearGradient>
    <linearGradient id="modelGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a6a8a"/>
      <stop offset="100%" stop-color="#7a5a7a"/>
    </linearGradient>
    <linearGradient id="predGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6a7a9a"/>
      <stop offset="100%" stop-color="#5a6a8a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <rect width="1200" height="650" fill="#fafafa"/>
  
  <text x="600" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333">
    Data Processing Pipeline
  </text>
  <text x="600" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">
    Home Credit Default Risk - ML Pipeline Architecture
  </text>
  
  <rect x="320" y="280" width="560" height="220" rx="12" fill="#f0f0f8" stroke="#b8a8d0" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="600" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#8a7aaa" font-weight="bold">Pipeline Orchestration Layer</text>
  
  <g transform="translate(50, 160)">
    <rect width="200" height="110" rx="8" fill="white" stroke="#ccc" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="200" height="35" rx="8" fill="url(#dataGradient)"/>
    <rect x="0" y="20" width="200" height="15" fill="url(#dataGradient)"/>
    <text x="100" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Raw Data</text>
    <text x="20" y="62" font-family="Arial, sans-serif" font-size="12" fill="#333">Load raw datasets</text>
    <text x="20" y="82" font-family="Arial, sans-serif" font-size="11" fill="#666" font-style="italic">load_data()</text>
  </g>
  
  <g transform="translate(280, 160)">
    <rect width="200" height="110" rx="8" fill="white" stroke="#ccc" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="200" height="35" rx="8" fill="url(#cleanGradient)"/>
    <rect x="0" y="20" width="200" height="15" fill="url(#cleanGradient)"/>
    <text x="100" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Data Cleaning</text>
    <text x="20" y="62" font-family="Arial, sans-serif" font-size="12" fill="#333">Handle missing values</text>
    <text x="20" y="82" font-family="Arial, sans-serif" font-size="11" fill="#666" font-style="italic">clean()</text>
  </g>
  
  <g transform="translate(510, 160)">
    <rect width="200" height="110" rx="8" fill="white" stroke="#ccc" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="200" height="35" rx="8" fill="url(#featureGradient)"/>
    <rect x="0" y="20" width="200" height="15" fill="url(#featureGradient)"/>
    <text x="100" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Feature Engineering</text>
    <text x="20" y="62" font-family="Arial, sans-serif" font-size="12" fill="#333">Extract and transform</text>
    <text x="20" y="82" font-family="Arial, sans-serif" font-size="11" fill="#666" font-style="italic">extract()</text>
  </g>
  
  <g transform="translate(740, 160)">
    <rect width="200" height="110" rx="8" fill="white" stroke="#ccc" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="200" height="35" rx="8" fill="url(#modelGradient)"/>
    <rect x="0" y="20" width="200" height="15" fill="url(#modelGradient)"/>
    <text x="100" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Model Training</text>
    <text x="20" y="62" font-family="Arial, sans-serif" font-size="12" fill="#333">Train ML models</text>
    <text x="20" y="82" font-family="Arial, sans-serif" font-size="11" fill="#666" font-style="italic">train()</text>
  </g>
  
  <g transform="translate(970, 160)">
    <rect width="180" height="110" rx="8" fill="white" stroke="#ccc" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="180" height="35" rx="8" fill="url(#predGradient)"/>
    <rect x="0" y="20" width="180" height="15" fill="url(#predGradient)"/>
    <text x="90" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Prediction</text>
    <text x="20" y="62" font-family="Arial, sans-serif" font-size="12" fill="#333">Generate predictions</text>
    <text x="20" y="82" font-family="Arial, sans-serif" font-size="11" fill="#666" font-style="italic">predict()</text>
  </g>
  
  <g transform="translate(1020, 360)">
    <rect width="80" height="60" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">OUT</text>
  </g>
  
  <line x1="250" y1="215" x2="280" y2="215" stroke="#666" stroke-width="2"/>
  <polygon points="280,215 275,212 275,218" fill="#666"/>
  
  <line x1="480" y1="215" x2="510" y2="215" stroke="#666" stroke-width="2"/>
  <polygon points="510,215 505,212 505,218" fill="#666"/>
  
  <line x1="710" y1="215" x2="740" y2="215" stroke="#666" stroke-width="2"/>
  <polygon points="740,215 735,212 735,218" fill="#666"/>
  
  <line x1="940" y1="215" x2="970" y2="215" stroke="#666" stroke-width="2"/>
  <polygon points="970,215 965,212 965,218" fill="#666"/>
  
  <line x1="1060" y1="270" x2="1060" y2="360" stroke="#666" stroke-width="2"/>
  <polygon points="1060,360 1057,355 1063,355" fill="#666"/>
  
  <rect x="350" y="340" width="500" height="120" rx="8" fill="white" stroke="#c8b8e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="600" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#333">pipeline.fit_transform(data)</text>
  <text x="600" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">(Fits transformers, transforms data, then fits model)</text>
  <text x="380" y="445" font-family="Arial, sans-serif" font-size="11" fill="#777">1. Data cleaning transformers</text>
  <text x="560" y="445" font-family="Arial, sans-serif" font-size="11" fill="#777">2. Feature extraction</text>
  <text x="740" y="445" font-family="Arial, sans-serif" font-size="11" fill="#777">3. Model fitting</text>
  
  <!-- ==================== FIXED LEGEND ==================== -->
  <rect x="100" y="540" width="1000" height="90" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  
  <!-- Pipeline Stages Section -->
  <text x="130" y="565" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Pipeline Stages:</text>
  
  <!-- Stage items in single row -->
  <g transform="translate(130, 580)">
    <rect width="20" height="14" rx="3" fill="url(#dataGradient)"/>
    <text x="28" y="12" font-family="Arial, sans-serif" font-size="10" fill="#555">Raw Data</text>
  </g>
  
  <g transform="translate(220, 580)">
    <rect width="20" height="14" rx="3" fill="url(#cleanGradient)"/>
    <text x="28" y="12" font-family="Arial, sans-serif" font-size="10" fill="#555">Cleaning</text>
  </g>
  
  <g transform="translate(310, 580)">
    <rect width="20" height="14" rx="3" fill="url(#featureGradient)"/>
    <text x="28" y="12" font-family="Arial, sans-serif" font-size="10" fill="#555">Features</text>
  </g>
  
  <g transform="translate(400, 580)">
    <rect width="20" height="14" rx="3" fill="url(#modelGradient)"/>
    <text x="28" y="12" font-family="Arial, sans-serif" font-size="10" fill="#555">Training</text>
  </g>
  
  <g transform="translate(490, 580)">
    <rect width="20" height="14" rx="3" fill="url(#predGradient)"/>
    <text x="28" y="12" font-family="Arial, sans-serif" font-size="10" fill="#555">Prediction</text>
  </g>
  
  <!-- Methods Section -->
  <text x="620" y="565" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Methods:</text>
  <text x="620" y="585" font-family="Arial, sans-serif" font-size="10" fill="#555">fit() - Train transformers/models</text>
  <text x="620" y="600" font-family="Arial, sans-serif" font-size="10" fill="#555">transform() - Apply transformations</text>
  
  <!-- Framework Section -->
  <text x="850" y="565" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Framework:</text>
  <text x="850" y="585" font-family="Arial, sans-serif" font-size="10" fill="#555">Steppy Pipeline</text>
  <text x="850" y="600" font-family="Arial, sans-serif" font-size="10" fill="#555">BaseTransformer Pattern</text>
  
</svg>