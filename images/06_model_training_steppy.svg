<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600">
  <defs>
    <!-- Gradients -->
    <linearGradient id="stepGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a8d5f0"/>
      <stop offset="100%" style="stop-color:#7ec0e6"/>
    </linearGradient>
    <linearGradient id="trainGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e5f5"/>
      <stop offset="100%" style="stop-color:#e1bee7"/>
    </linearGradient>
    <linearGradient id="dataGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd"/>
      <stop offset="100%" style="stop-color:#bbdefb"/>
    </linearGradient>
    <linearGradient id="initGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9"/>
      <stop offset="100%" style="stop-color:#c8e6c9"/>
    </linearGradient>
    <linearGradient id="validGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0"/>
      <stop offset="100%" style="stop-color:#ffe0b2"/>
    </linearGradient>
    <linearGradient id="predGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f7fa"/>
      <stop offset="100%" style="stop-color:#b2ebf2"/>
    </linearGradient>
    <!-- Drop shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1100" height="600" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="550" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#2c3e50">
    Model Training: Steppy Pipeline
  </text>
  
  <!-- Outer dashed container -->
  <rect x="50" y="100" width="1000" height="260" rx="20" ry="20" fill="none" stroke="#d4a5d4" stroke-width="3" stroke-dasharray="10,6"/>
  
  <!-- Step labels above -->
  <text x="130" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#9b59b6">Step 1</text>
  <text x="310" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#9b59b6">Step 2</text>
  <text x="490" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#9b59b6">Step 3</text>
  <text x="670" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#9b59b6">Step 4</text>
  <text x="850" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#9b59b6">Step 5</text>
  
  <!-- Step 1: Data Split -->
  <g transform="translate(60, 120)">
    <rect width="140" height="140" rx="12" ry="12" fill="url(#dataGradient)" stroke="#5a7a94" stroke-width="2" filter="url(#shadow)"/>
    <text x="70" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">DataSplit</text>
    <text x="70" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">train/valid</text>
    <text x="70" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">X, y → split</text>
  </g>
  
  <!-- Arrow 1 to 2 -->
  <path d="M 210 190 L 240 190" fill="none" stroke="#7f8c8d" stroke-width="3"/>
  <polygon points="240,190 230,185 230,195" fill="#7f8c8d"/>
  
  <!-- Step 2: Init Model -->
  <g transform="translate(250, 120)">
    <rect width="120" height="140" rx="12" ry="12" fill="url(#initGradient)" stroke="#5a7a94" stroke-width="2" filter="url(#shadow)"/>
    <text x="60" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Init</text>
    <text x="60" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">params</text>
    <text x="60" y="105" text-anchor="middle" font-family="monospace" font-size="10" fill="#2c3e50">LightGBM()</text>
  </g>
  
  <!-- Arrow 2 to 3 -->
  <path d="M 380 190 L 410 190" fill="none" stroke="#7f8c8d" stroke-width="3"/>
  <polygon points="410,190 400,185 400,195" fill="#7f8c8d"/>
  
  <!-- Step 3: Training -->
  <g transform="translate(430, 120)">
    <rect width="120" height="140" rx="12" ry="12" fill="url(#trainGradient)" stroke="#5a7a94" stroke-width="2" filter="url(#shadow)"/>
    <text x="60" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Training</text>
    <text x="60" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">.fit()</text>
    <text x="60" y="105" text-anchor="middle" font-family="monospace" font-size="9" fill="#2c3e50">X_train, y_train</text>
  </g>
  
  <!-- Arrow 3 to 4 -->
  <path d="M 560 190 L 590 190" fill="none" stroke="#7f8c8d" stroke-width="3"/>
  <polygon points="590,190 580,185 580,195" fill="#7f8c8d"/>
  
  <!-- Step 4: Validation -->
  <g transform="translate(610, 120)">
    <rect width="120" height="140" rx="12" ry="12" fill="url(#validGradient)" stroke="#5a7a94" stroke-width="2" filter="url(#shadow)"/>
    <text x="60" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Valid</text>
    <text x="60" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">early_stop</text>
    <text x="60" y="105" text-anchor="middle" font-family="monospace" font-size="9" fill="#2c3e50">eval_set</text>
  </g>
  
  <!-- Arrow 4 to 5 -->
  <path d="M 740 190 L 770 190" fill="none" stroke="#7f8c8d" stroke-width="3"/>
  <polygon points="770,190 760,185 760,195" fill="#7f8c8d"/>
  
  <!-- Step 5: Prediction -->
  <g transform="translate(790, 120)">
    <rect width="120" height="140" rx="12" ry="12" fill="url(#predGradient)" stroke="#5a7a94" stroke-width="2" filter="url(#shadow)"/>
    <text x="60" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Predict</text>
    <text x="60" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">.predict()</text>
    <text x="60" y="105" text-anchor="middle" font-family="monospace" font-size="9" fill="#2c3e50">X_test</text>
  </g>
  
  <!-- Arrow 5 to Output -->
  <path d="M 920 190 L 950 190" fill="none" stroke="#7f8c8d" stroke-width="3"/>
  <polygon points="950,190 940,185 940,195" fill="#7f8c8d"/>
  
  <!-- Output Box -->
  <g transform="translate(960, 150)">
    <rect width="70" height="80" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/>
    <text x="35" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">OUT</text>
  </g>
  
  <!-- Method labels below steps -->
  <text x="130" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d" font-style="italic">fit_transform()</text>
  <text x="310" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d" font-style="italic">__init__()</text>
  <text x="490" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d" font-style="italic">fit()</text>
  <text x="670" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d" font-style="italic">early_stopping</text>
  <text x="850" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d" font-style="italic">transform()</text>
  
  <!-- Bottom description -->
  <text x="550" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#7f8c8d">
    BaseTransformer: fit() trains model, transform() generates predictions
  </text>
  
  <!-- Code snippet box -->
  <rect x="200" y="380" width="700" height="120" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="550" y="415" text-anchor="middle" font-family="monospace" font-size="14" fill="#2c3e50">
    model = LightGBM(params)
  </text>
  <text x="550" y="450" text-anchor="middle" font-family="monospace" font-size="14" fill="#2c3e50">
    model.fit(X_train, y_train, eval_set=[(X_valid, y_valid)])
  </text>
  <text x="550" y="485" text-anchor="middle" font-family="monospace" font-size="14" fill="#2c3e50">
    predictions = model.predict(X_test)  # transform() returns dict
  </text>
  
  <!-- Legend box -->
  <rect x="250" y="520" width="600" height="65" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="550" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Model Training Pattern:</text>
  <text x="550" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">LightGBM / XGBoost / CatBoost extend BaseTransformer with fit() + predict()</text>
</svg>
