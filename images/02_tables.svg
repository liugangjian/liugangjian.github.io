<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Table header gradients -->
    <linearGradient id="mainHeader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5a7a94"/>
      <stop offset="100%" style="stop-color:#4a6a84"/>
    </linearGradient>
    <linearGradient id="secondaryHeader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8a8a9a"/>
      <stop offset="100%" style="stop-color:#7a7a8a"/>
    </linearGradient>
    <linearGradient id="detailHeader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7aa08a"/>
      <stop offset="100%" style="stop-color:#6a907a"/>
    </linearGradient>
    <linearGradient id="clientHeader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a7ba7"/>
      <stop offset="100%" style="stop-color:#3a6b97"/>
    </linearGradient>
    
    <!-- Drop shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333">
    Database Schema: Relational Architecture
  </text>
  <line x1="100" y1="60" x2="1100" y2="60" stroke="#ddd" stroke-width="1"/>
  
  <!-- ============= CLIENT_MAIN TABLE (NEW - TOP CENTER) ============= -->
  <g transform="translate(475, 90)">
    <!-- Table container with shadow -->
    <rect width="250" height="80" rx="8" ry="8" fill="white" stroke="#ccc" stroke-width="1.5" filter="url(#shadow)"/>
    <!-- Header -->
    <rect width="250" height="32" rx="8" ry="8" fill="url(#clientHeader)"/>
    <rect x="0" y="20" width="250" height="12" fill="url(#clientHeader)"/>
    <text x="125" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">client_main</text>
    <!-- Content -->
    <text x="20" y="58" font-family="Arial, sans-serif" font-size="13" fill="#333">PK: CLIENT_ID_MAIN</text>
  </g>
  
  <!-- ============= APPLICATION TABLE ============= -->
  <g transform="translate(475, 210)">
    <rect width="250" height="95" rx="8" ry="8" fill="white" stroke="#ccc" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="250" height="32" rx="8" ry="8" fill="url(#mainHeader)"/>
    <rect x="0" y="20" width="250" height="12" fill="url(#mainHeader)"/>
    <text x="125" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">application</text>
    <text x="20" y="58" font-family="Arial, sans-serif" font-size="13" fill="#333">PK: SK_ID_CURR</text>
    <text x="20" y="78" font-family="Arial, sans-serif" font-size="13" fill="#333">FK: CLIENT_ID_MAIN</text>
  </g>
  
  <!-- ============= BUREAU TABLE ============= -->
  <g transform="translate(150, 370)">
    <rect width="230" height="80" rx="8" ry="8" fill="white" stroke="#ccc" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="230" height="32" rx="8" ry="8" fill="url(#secondaryHeader)"/>
    <rect x="0" y="20" width="230" height="12" fill="url(#secondaryHeader)"/>
    <text x="115" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">bureau</text>
    <text x="20" y="58" font-family="Arial, sans-serif" font-size="13" fill="#333">FK: SK_ID_CURR</text>
  </g>
  
  <!-- ============= PREVIOUS_APPLICATION TABLE ============= -->
  <g transform="translate(820, 370)">
    <rect width="230" height="80" rx="8" ry="8" fill="white" stroke="#ccc" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="230" height="32" rx="8" ry="8" fill="url(#secondaryHeader)"/>
    <rect x="0" y="20" width="230" height="12" fill="url(#secondaryHeader)"/>
    <text x="115" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">previous_application</text>
    <text x="20" y="58" font-family="Arial, sans-serif" font-size="13" fill="#333">FK: SK_ID_CURR</text>
  </g>
  
  <!-- ============= BUREAU_BALANCE TABLE ============= -->
  <g transform="translate(80, 540)">
    <rect width="200" height="80" rx="8" ry="8" fill="white" stroke="#ccc" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="200" height="32" rx="8" ry="8" fill="url(#detailHeader)"/>
    <rect x="0" y="20" width="200" height="12" fill="url(#detailHeader)"/>
    <text x="100" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">bureau_balance</text>
    <text x="20" y="58" font-family="Arial, sans-serif" font-size="12" fill="#333">FK: SK_ID_BUREAU</text>
  </g>
  
  <!-- ============= CREDIT_CARD_BALANCE TABLE ============= -->
  <g transform="translate(345, 540)">
    <rect width="200" height="80" rx="8" ry="8" fill="white" stroke="#ccc" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="200" height="32" rx="8" ry="8" fill="url(#detailHeader)"/>
    <rect x="0" y="20" width="200" height="12" fill="url(#detailHeader)"/>
    <text x="100" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">credit_card_balance</text>
    <text x="20" y="58" font-family="Arial, sans-serif" font-size="12" fill="#333">FK: SK_ID_PREV</text>
  </g>
  
  <!-- ============= POS_CASH_BALANCE TABLE ============= -->
  <g transform="translate(610, 540)">
    <rect width="200" height="80" rx="8" ry="8" fill="white" stroke="#ccc" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="200" height="32" rx="8" ry="8" fill="url(#detailHeader)"/>
    <rect x="0" y="20" width="200" height="12" fill="url(#detailHeader)"/>
    <text x="100" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">POS_CASH_balance</text>
    <text x="20" y="58" font-family="Arial, sans-serif" font-size="12" fill="#333">FK: SK_ID_PREV</text>
  </g>
  
  <!-- ============= INSTALLMENTS_PAYMENTS TABLE ============= -->
  <g transform="translate(875, 540)">
    <rect width="200" height="80" rx="8" ry="8" fill="white" stroke="#ccc" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="200" height="32" rx="8" ry="8" fill="url(#detailHeader)"/>
    <rect x="0" y="20" width="200" height="12" fill="url(#detailHeader)"/>
    <text x="100" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">installments_payments</text>
    <text x="20" y="58" font-family="Arial, sans-serif" font-size="12" fill="#333">FK: SK_ID_PREV</text>
  </g>
  
  <!-- ============= CONNECTION LINES ============= -->
  
  <!-- Line: client_main -> application -->
  <line x1="600" y1="170" x2="600" y2="210" stroke="#666" stroke-width="2"/>
  <!-- Label - positioned ABOVE the line -->
  <rect x="615" y="182" width="130" height="16" rx="3" fill="#fafafa" fill-opacity="0.9"/>
  <text x="680" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555" font-style="italic">CLIENT_ID_MAIN</text>
  
  <!-- Line: application -> bureau (left branch) -->
  <path d="M 600 305 L 600 330 L 265 330 L 265 370" fill="none" stroke="#666" stroke-width="1.5"/>
  <!-- Label - positioned ABOVE the line -->
  <rect x="350" y="315" width="85" height="16" rx="3" fill="#fafafa" fill-opacity="0.9"/>
  <text x="392" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555" font-style="italic">SK_ID_CURR</text>
  
  <!-- Line: application -> previous_application (right branch) -->
  <path d="M 600 305 L 600 330 L 935 330 L 935 370" fill="none" stroke="#666" stroke-width="1.5"/>
  <!-- Label - positioned ABOVE the line -->
  <rect x="805" y="315" width="85" height="16" rx="3" fill="#fafafa" fill-opacity="0.9"/>
  <text x="847" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555" font-style="italic">SK_ID_CURR</text>
  
  <!-- Line: bureau -> bureau_balance -->
  <path d="M 265 450 L 265 490 L 180 490 L 180 540" fill="none" stroke="#666" stroke-width="1.5"/>
  <!-- Label - positioned to the LEFT of the line -->
  <rect x="175" y="475" width="95" height="16" rx="3" fill="#fafafa" fill-opacity="0.9"/>
  <text x="222" y="487" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555" font-style="italic">SK_ID_BUREAU</text>
  
  <!-- Line: previous_application -> credit_card_balance -->
  <path d="M 935 450 L 935 490 L 445 490 L 445 540" fill="none" stroke="#666" stroke-width="1.5"/>
  <!-- Label - positioned ABOVE the line -->
  <rect x="625" y="475" width="85" height="16" rx="3" fill="#fafafa" fill-opacity="0.9"/>
  <text x="667" y="487" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555" font-style="italic">SK_ID_PREV</text>
  
  <!-- Line: previous_application -> POS_CASH_balance -->
  <path d="M 935 450 L 935 510 L 710 510 L 710 540" fill="none" stroke="#666" stroke-width="1.5"/>
  <!-- Label - positioned ABOVE the line -->
  <rect x="770" y="495" width="85" height="16" rx="3" fill="#fafafa" fill-opacity="0.9"/>
  <text x="812" y="507" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555" font-style="italic">SK_ID_PREV</text>
  
  <!-- Line: previous_application -> installments_payments -->
  <path d="M 935 450 L 935 530 L 975 530 L 975 540" fill="none" stroke="#666" stroke-width="1.5"/>
  <!-- Label - positioned ABOVE the line -->
  <rect x="935" y="515" width="85" height="16" rx="3" fill="#fafafa" fill-opacity="0.9"/>
  <text x="977" y="527" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555" font-style="italic">SK_ID_PREV</text>
  
  <!-- ============= LEGEND (BETTER ORGANIZED) ============= -->
  
  <!-- Legend background box -->
  <rect x="100" y="680" width="1000" height="90" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  
  <!-- Section: Table Types -->
  <text x="130" y="705" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Table Types:</text>
  
  <!-- Main color swatch -->
  <rect x="130" y="720" width="22" height="18" rx="3" fill="url(#mainHeader)"/>
  <text x="160" y="733" font-family="Arial, sans-serif" font-size="12" fill="#555">Main</text>
  
  <!-- Secondary color swatch -->
  <rect x="220" y="720" width="22" height="18" rx="3" fill="url(#secondaryHeader)"/>
  <text x="250" y="733" font-family="Arial, sans-serif" font-size="12" fill="#555">Secondary</text>
  
  <!-- Detail color swatch -->
  <rect x="340" y="720" width="22" height="18" rx="3" fill="url(#detailHeader)"/>
  <text x="370" y="733" font-family="Arial, sans-serif" font-size="12" fill="#555">Detail</text>
  
  <!-- Client Main color swatch (NEW) -->
  <rect x="440" y="720" width="22" height="18" rx="3" fill="url(#clientHeader)"/>
  <text x="470" y="733" font-family="Arial, sans-serif" font-size="12" fill="#555">Client (Top Level)</text>
  
  <!-- Section: Key Definitions -->
  <text x="630" y="705" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Key Definitions:</text>
  
  <!-- PK definition -->
  <text x="630" y="728" font-family="Arial, sans-serif" font-size="12" fill="#555" font-weight="bold">PK</text>
  <text x="650" y="728" font-family="Arial, sans-serif" font-size="12" fill="#555">= Primary Key</text>
  
  <!-- FK definition -->
  <text x="630" y="748" font-family="Arial, sans-serif" font-size="12" fill="#555" font-weight="bold">FK</text>
  <text x="650" y="748" font-family="Arial, sans-serif" font-size="12" fill="#555">= Foreign Key</text>
  
  <!-- Relationship info -->
  <text x="780" y="705" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Relationships:</text>
  <text x="780" y="728" font-family="Arial, sans-serif" font-size="11" fill="#555">• One Client → Multiple Applications</text>
  <text x="780" y="745" font-family="Arial, sans-serif" font-size="11" fill="#555">• One Application → Multiple Records</text>
  
</svg>