<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="1000" height="780">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="beforeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffebee"/>
      <stop offset="100%" stop-color="#ffcdd2"/>
    </linearGradient>
    <linearGradient id="afterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="funcGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="780" fill="#fafbfc"/>
  
  <!-- ==================== TITLE ==================== -->
  <text x="500" y="45" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" fill="#1a1a2e">
    Feature Engineering: One-to-Many Aggregation
  </text>
  <text x="500" y="75" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#666">
    Child table records → Single aggregated row per SK_ID_CURR
  </text>
  
  <!-- ==================== MAIN PROCESS FLOW ==================== -->
  
  <!-- BEFORE Card (Left) -->
  <g transform="translate(70, 110)">
    <!-- Card -->
    <rect width="320" height="320" rx="16" fill="url(#beforeGrad)" stroke="#e57373" stroke-width="2.5" filter="url(#softShadow)"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="320" height="50" rx="16" fill="#e57373"/>
    <rect x="0" y="30" width="320" height="20" fill="#e57373"/>
    <text x="160" y="33" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="white">BEFORE: Multiple Rows</text>
    
    <!-- Table -->
    <g transform="translate(20, 70)">
      <!-- Table Header -->
      <rect width="280" height="36" rx="6" fill="#ef9a9a" fill-opacity="0.5"/>
      <text x="140" y="24" text-anchor="middle" font-family="'SF Mono', Monaco, monospace" font-size="13" font-weight="600" fill="#c62828">SK_ID_CURR    DAYS    AMT</text>
      
      <!-- Row 1 -->
      <rect y="42" width="280" height="34" rx="4" fill="white" fill-opacity="0.7"/>
      <text x="140" y="64" text-anchor="middle" font-family="'SF Mono', Monaco, monospace" font-size="13" fill="#333">100001    365    5000</text>
      
      <!-- Row 2 -->
      <rect y="82" width="280" height="34" rx="4" fill="white" fill-opacity="0.7"/>
      <text x="140" y="104" text-anchor="middle" font-family="'SF Mono', Monaco, monospace" font-size="13" fill="#333">100001    180    3000</text>
      
      <!-- Row 3 -->
      <rect y="122" width="280" height="34" rx="4" fill="white" fill-opacity="0.7"/>
      <text x="140" y="144" text-anchor="middle" font-family="'SF Mono', Monaco, monospace" font-size="13" fill="#333">100001     90    8000</text>
      
      <!-- Row 4 -->
      <rect y="162" width="280" height="34" rx="4" fill="white" fill-opacity="0.7"/>
      <text x="140" y="184" text-anchor="middle" font-family="'SF Mono', Monaco, monospace" font-size="13" fill="#666">100001     30    2000</text>
      
      <!-- More indicator -->
      <text x="140" y="225" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#999">+ many more rows...</text>
    </g>
  </g>
  
  <!-- Center Arrow -->
  <g transform="translate(410, 245)">
    <!-- Arrow line -->
    <line x1="0" y1="25" x2="110" y2="25" stroke="#9c27b0" stroke-width="4" stroke-linecap="round"/>
    <polygon points="110,25 100,18 100,32" fill="#9c27b0"/>
    
    <!-- Arrow label box -->
    <rect x="5" y="50" width="100" height="56" rx="8" fill="white" stroke="#9c27b0" stroke-width="2" filter="url(#softShadow)"/>
    <text x="55" y="75" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#9c27b0">GROUPBY</text>
    <text x="55" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#9c27b0">AGGREGATION</text>
  </g>
  
  <!-- AFTER Card (Right) -->
  <g transform="translate(540, 110)">
    <!-- Card -->
    <rect width="320" height="320" rx="16" fill="url(#afterGrad)" stroke="#66bb6a" stroke-width="2.5" filter="url(#softShadow)"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="320" height="50" rx="16" fill="#66bb6a"/>
    <rect x="0" y="30" width="320" height="20" fill="#66bb6a"/>
    <text x="160" y="33" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="white">AFTER: Single Row</text>
    
    <!-- Table -->
    <g transform="translate(20, 70)">
      <!-- Table Header -->
      <rect width="280" height="36" rx="6" fill="#81c784" fill-opacity="0.5"/>
      <text x="140" y="24" text-anchor="middle" font-family="'SF Mono', Monaco, monospace" font-size="11" font-weight="600" fill="#2e7d32">SK_ID   COUNT   SUM   MEAN   STD</text>
      
      <!-- Single Result Row -->
      <rect y="50" width="280" height="46" rx="6" fill="white" fill-opacity="0.9" stroke="#a5d6a7" stroke-width="2"/>
      <text x="140" y="80" text-anchor="middle" font-family="'SF Mono', Monaco, monospace" font-size="13" font-weight="600" fill="#1b5e20">100001    4    18000   4500   2582</text>
      
      <!-- Additional features box -->
      <rect y="115" width="280" height="100" rx="8" fill="#c8e6c9" fill-opacity="0.5" stroke="#a5d6a7" stroke-width="1"/>
      <text x="140" y="140" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#2e7d32">Additional Aggregated Features:</text>
      <text x="140" y="165" text-anchor="middle" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#388e3c">MAX(AMT)=8000, MIN(AMT)=2000</text>
      <text x="140" y="185" text-anchor="middle" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#388e3c">MAX(DAYS)=365, MIN(DAYS)=30</text>
      <text x="140" y="205" text-anchor="middle" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#388e3c">COUNT > 0, COUNT_UNIQUE</text>
    </g>
  </g>
  
  <!-- ==================== AGGREGATION FUNCTIONS ==================== -->
  
  <text x="500" y="480" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#1a1a2e">
    Key Aggregation Functions
  </text>
  
  <!-- Row 1: 3 functions centered -->
  <g transform="translate(140, 510)">
    <!-- COUNT -->
    <rect width="160" height="80" rx="12" fill="url(#funcGrad)" stroke="#42a5f5" stroke-width="2.5" filter="url(#softShadow)"/>
    <text x="80" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#1565c0">COUNT</text>
    <text x="80" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#547e9c">Number of records</text>
  </g>
  
  <g transform="translate(340, 510)">
    <!-- SUM -->
    <rect width="160" height="80" rx="12" fill="url(#funcGrad)" stroke="#42a5f5" stroke-width="2.5" filter="url(#softShadow)"/>
    <text x="80" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#1565c0">SUM</text>
    <text x="80" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#547e9c">Total sum</text>
  </g>
  
  <g transform="translate(540, 510)">
    <!-- MEAN -->
    <rect width="160" height="80" rx="12" fill="url(#funcGrad)" stroke="#42a5f5" stroke-width="2.5" filter="url(#softShadow)"/>
    <text x="80" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#1565c0">MEAN</text>
    <text x="80" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#547e9c">Average value</text>
  </g>
  
  <g transform="translate(740, 510)">
    <!-- MAX/MIN -->
    <rect width="160" height="80" rx="12" fill="url(#funcGrad)" stroke="#42a5f5" stroke-width="2.5" filter="url(#softShadow)"/>
    <text x="80" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#1565c0">MAX/MIN</text>
    <text x="80" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#547e9c">Extreme values</text>
  </g>
  
  <!-- Row 2: 1 function centered -->
  <g transform="translate(420, 610)">
    <!-- STD -->
    <rect width="160" height="80" rx="12" fill="url(#funcGrad)" stroke="#42a5f5" stroke-width="2.5" filter="url(#softShadow)"/>
    <text x="80" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#1565c0">STD</text>
    <text x="80" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#547e9c">Standard deviation</text>
  </g>
  
  <!-- ==================== BOTTOM EXPLANATION ==================== -->
  
  <rect x="150" y="710" width="700" height="55" rx="10" fill="#f5f7fa" stroke="#e1e4e8" stroke-width="1.5"/>
  <text x="500" y="732" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#2d3748">
    GROUPBY on SK_ID_CURR
  </text>
  <text x="500" y="752" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#718096">
    Child tables are aggregated to one row per unique application ID
  </text>
  
</svg>